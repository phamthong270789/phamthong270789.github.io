<style>
/* Màn khóa của app: cùng nhận diện với đầu trang dashboard — nền xanh đậm #012060 (đúng màu nền logo Thợ ĐMX)
   chuyển dần sang xanh dương, logo nằm trên phần nền phẳng; thẻ đăng nhập trắng nổi lên, nút vàng theo màu logo. */
:root{
  --navy:#012060; --blue:#0A3A9A; --blue2:#1D5FD8; --yellow:#FFD200; --yellow-ink:#012060;
  --bg:#EEF3FB; --surface:#FFFFFF; --sunk:#F2F6FC; --ink:#0F1B33; --muted:#5B6884; --line:#D6DFEE;
  --accent:#1D4ED8; --bad:#B3261E; --bad-soft:#FBE3E1;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Barlow Semi Condensed","Be Vietnam Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#121B2E; --sunk:#1A2540; --ink:#E6ECF7; --muted:#97A6BF; --line:#26324D;
  --accent:#7AA2FF; --bad:#F87171; --bad-soft:#3B1717; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121B2E; --sunk:#1A2540; --ink:#E6ECF7; --muted:#97A6BF; --line:#26324D;
  --accent:#7AA2FF; --bad:#F87171; --bad-soft:#3B1717; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
.lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.hero{min-height:46vh;min-height:46dvh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:linear-gradient(180deg,var(--navy) 0%,var(--navy) 52%,var(--blue) 82%,var(--blue2) 100%);color:#fff;text-align:center;
  padding:calc(36px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-left,0px)) 86px;border-radius:0 0 50% 50% / 0 0 40px 40px}

.logo{display:block;height:64px;width:auto;margin:0 auto 18px}
.hero h1{margin:0;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.hero h1 span{color:var(--yellow)}
.hero p{margin:6px 0 0;font-size:13.5px;color:rgba(255,255,255,.8)}
.stamp{display:inline-flex;max-width:100%;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;margin-top:16px;font-size:12px;color:rgba(255,255,255,.85);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px}
.stamp b{color:#fff;font-family:var(--f-num);font-size:14px;font-weight:600}
.stamp i{width:7px;height:7px;border-radius:50%;background:#4ADE80;flex:none}
/* ô "Đã có số mới": trình duyệt đang giữ bản cũ (GitHub cho giữ 10 phút) mà máy chủ đã có bản mới hơn */
.moi{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,#16A34A 12%,var(--surface));border:1px solid color-mix(in srgb,#16A34A 35%,var(--line));
  color:var(--ink);font-size:13px;border-radius:12px;padding:10px 12px}
.moi[hidden]{display:none}
.moi b{font-family:var(--f-num);font-size:14px}
.moi button{flex:none;border:0;border-radius:999px;background:#16A34A;color:#fff;font:700 12.5px var(--f-ui);padding:7px 12px;cursor:pointer}
.card{position:relative;z-index:1;width:calc(100% - 32px);max-width:400px;margin:-64px auto 0;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:24px 20px 20px;display:grid;gap:16px;box-shadow:0 12px 32px rgba(1,32,96,.16)}
.card h2{margin:0;font-size:17px;font-weight:700}
.card h2 + p{margin:-10px 0 0;font-size:13px;color:var(--muted)}
form{display:grid;gap:14px}
label.f{display:grid;gap:6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pw{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--sunk);overflow:hidden;transition:border-color .15s}
.pw:focus-within{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.pw svg{flex:none;margin-left:12px;color:var(--muted)}
.pw input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px var(--f-ui);padding:13px 10px;outline:none;letter-spacing:normal;text-transform:none}
.pw button{border:0;background:transparent;color:var(--accent);font:600 13px var(--f-ui);padding:0 14px;align-self:stretch;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.go{border:0;border-radius:12px;background:var(--yellow);color:var(--yellow-ink);font:700 16px var(--f-ui);padding:14px;cursor:pointer;
  box-shadow:0 4px 12px rgba(255,210,0,.35);transition:transform .1s}
.go:active{transform:translateY(1px)}
.go:disabled{opacity:.7;cursor:wait}
.go:focus-visible,.pw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:500;border-radius:10px;padding:9px 12px}
.foot{margin-top:auto;font-size:11.5px;color:var(--muted);text-align:center;padding:16px 24px calc(20px + env(safe-area-inset-bottom,0px))}
.foot svg{vertical-align:-2px;margin-right:4px}
</style>

async function keyFromPw(pw) {
  // mật khẩu có chữ có dấu: bàn phím điện thoại có thể gõ dạng tổ hợp -> chuẩn NFC như lúc mã hóa
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC').trim()), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name: 'PBKDF2', salt: b64(ENC.s), iterations: ENC.n, hash: 'SHA-256'}, base, 256);
  return new Uint8Array(bits);
}
async function giaiMa(raw, enc) {
  const key = await crypto.subtle.importKey('raw', raw, {name: 'AES-CBC'}, false, ['decrypt']);
  const plain = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-CBC', iv: b64(enc.i)}, key, b64(enc.c)));
  if (!plain.startsWith('TQOK\n')) throw new Error('sai');
  return plain.slice(5);
}
// Làm mới trong dashboard (anh chọn 22/10): không bắt nhập lại mật khẩu. Dashboard khai báo biến toàn cục nên không vẽ lại 2 lần

// Đóng app / mở lại link / nút Khóa vẫn phải nhập mật khẩu.
const RE_KEY = 'tq_lam_moi', RE_MSG = 'tq_lam_moi_msg';
const ub64 = u => btoa(String.fromCharCode(...u));
function bao(t) {
  const e = document.createElement('div');
  e.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:60;background:#0F1B33;color:#fff;' +
    'font:600 13px "Be Vietnam Pro",system-ui,sans-serif;border-radius:999px;padding:9px 16px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center';
  e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 3000);
}
async function lamMoiSo(btn, raw, cap) {
  btn.disabled = true; btn.classList.add('quay');
  let t = '';
  try { t = await (await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'})).text(); } catch (e) {}
  const capMoi = (t.match(/"cap":"([^"]*)"/) || [])[1];
  if (capMoi && capMoi === cap) { btn.disabled = false; btn.classList.remove('quay'); bao('Số đã mới nhất · cập nhật ' + cap); return; }
  try { sessionStorage.setItem(RE_KEY, ub64(raw)); sessionStorage.setItem(RE_MSG, '1'); } catch (e) {}
  location.replace(location.pathname + '?v=' + Date.now());
}
// Xem tháng cũ (anh chọn 02/11): mỗi tháng đã chốt là 1 trang riêng <GOC>thang-MM-yyyy/, cùng mật khẩu + salt -> cùng khóa.
// Danh sách tháng ở <GOC>thang.json [{t:"MM/yyyy", p:"đường dẫn"}], tháng mới nhất đầu tiên. Đổi tháng mang khóa qua sessionStorage như Làm mới.
const GOC = '/';
const dsThang = () => fetch(GOC + 'thang.json?v=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.json() : []).catch(() => []);
function doiThang(raw, p) {
  try { sessionStorage.setItem(RE_KEY, ub64(raw)); sessionStorage.setItem(RE_MSG, 'th'); } catch (e) {}
  location.replace(GOC + p + '?v=' + Date.now());
}

    // điện thoại: ô chọn chi nhánh lên 1 dòng riêng, dòng dưới: khoảng ngày · Xuất Excel · Làm mới (không làm trang rộng ra)
    '@media (max-width:480px){.pickrow{flex-wrap:wrap}.pickrow .pick{flex:1 1 100%}.pickrow .range{margin-right:auto}}</style>' +

    'b.onclick=function(){window.__tqLamMoi(b)};x.after(b)})()<\/script>' +
    // ô chọn tháng: trên đầu trang, ngay trên "Dữ liệu đến"; chỉ hiện khi có từ 2 tháng
    '<style>.thsel{display:block;margin:0 0 8px auto;max-width:100%;appearance:none;-webkit-appearance:none;border:0;border-radius:999px;cursor:pointer;' +
